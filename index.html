const LoginPage=({onLogin})=>{
const[email,setEmail]=useState('');
const[password,setPassword]=useState('');
const[loading,setLoading]=useState(false);
const[error,setError]=useState('');
const handleSubmit=async(e)=>{
e.preventDefault();
setLoading(true);
setError('');
try{
const{signInWithEmailAndPassword,createUserWithEmailAndPassword}=window.fb.utils;
try{
const cred=await signInWithEmailAndPassword(window.fb.auth,email,password);
onLogin(cred.user);
}catch(err){
if(err.code==='auth/user-not-found'||err.code==='auth/invalid-credential'){
const cred=await createUserWithEmailAndPassword(window.fb.auth,email,password);
onLogin(cred.user);
}else throw err;
}
}catch(err){
setError(err.message);
}finally{
setLoading(false);
}
};
return(
<div className="min-h-screen bg-gradient-to-br from-blue-600 via-purple-600 to-pink-600 flex items-center justify-center p-4">
<div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md">
<div className="text-center mb-8">
<div className="w-20 h-20 bg-gradient-to-br from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
<Icon.Tool/>
</div>

<p className="text-gray-600 mt-2">Gestionale Completo</p>
</div>
{error&&<div className="bg-red-50 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded mb-4 text-sm">{error}</div>}
<form onSubmit={handleSubmit} className="space-y-4">
<div>

</div>
<div>
<label className="block text-sm font-semibold mb-2">Password</label>
<input type="password" value={password} onChange={(e)=>setPassword(e.target.value)} className="w-full px-4 py-3 border-2 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" required minLength="6"/>

};

<div className="grid grid-cols-1 md:grid-cols-3 gap-6">
<div className="bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl p-6 text-white shadow-xl"><h3 className="font-bold mb-2 opacity-90">🏗️ Cantieri</h3><p className="text-4xl font-bold">{cantieri.length}</p><p className="text-sm opacity-90">In corso: {cantieri.filter(c=>c.stato==='In corso').length}</p></div>
<div className="bg-gradient-to-br from-green-500 to-green-600 rounded-xl p-6 text-white shadow-xl"><h3 className="font-bold mb-2 opacity-90">👷 Dipendenti</h3><p className="text-4xl font-bold">{dipendenti.length}</p><p className="text-sm opacity-90">Totali attivi</p></div>
<div className="bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl p-6 text-white shadow-xl"><h3 className="font-bold mb-2 opacity-90">🔧 Attrezzature</h3><p className="text-4xl font-bold">{attrezzature.length}</p><p className="text-sm opacity-90">Tot pz: {attrezzature.reduce((s,a)=>s+(a.qta||1),0)}</p></div>
<div className="bg-gradient-to-br from-orange-500 to-red-500 rounded-xl p-6 text-white shadow-xl"><h3 className="font-bold mb-2 opacity-90">📦 Materiali</h3><p className="text-4xl font-bold">{materiali.length}</p><p className="text-sm opacity-90">Sotto scorta: {materiali.filter(m=>m.giacenza<=m.min).length}</p></div>
<div className="bg-gradient-to-br from-red-500 to-pink-500 rounded-xl p-6 text-white shadow-xl"><h3 className="font-bold mb-2 opacity-90">📋 Rapportini</h3><p className="text-4xl font-bold">{rappFiltrati.length}</p><p className="text-sm opacity-90">Filtrati</p></div>
<div className="bg-gradient-to-br from-indigo-500 to-purple-500 rounded-xl p-6 text-white shadow-xl"><h3 className="font-bold mb-2 opacity-90">🚚 Movimenti</h3><p className="text-4xl font-bold">{movFiltrati.length}</p><p className="text-sm opacity-90">Filtrati</p></div>
</div>
<div className="bg-white rounded-xl p-6 shadow-lg"><h3 className="text-xl font-bold mb-4">📍 Giacenze Attrezzature</h3><div className="space-y-3">{attrezzature.map(a=><div key={a.id} className="border-b pb-3"><p className="font-bold">{a.nome} - Tot: {a.qta} {a.um}</p><div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2">{Object.entries(a.giacenze||{}).map(([loc,qty])=><div key={loc} className="bg-blue-50 p-2 rounded"><p className="font-semibold text-sm">{loc}</p><p className="text-xs font-bold text-blue-600">{qty} {a.um||'pz'} ({Math.round((qty/a.qta)*100)}%)</p></div>)}</div></div>)}</div></div>
</div>
);
}
const dataMap={fornitori,cantieri,dipendenti,attrezzature,materiali,movimenti,mezzi,rapportini,ddt,ordini,scadenze};
const data=dataMap[section]||[];
const filtered=data.filter(item=>!search||JSON.stringify(item).toLowerCase().includes(search.toLowerCase()));
const labels={fornitori:'Fornitore',cantieri:'Cantiere',dipendenti:'Dipendente',attrezzature:'Attrezzatura',materiali:'Materiale',movimenti:'Movimento',mezzi:'Mezzo',rapportini:'Rapportino',ddt:'DDT',ordini:'Ordine',scadenze:'Scadenza'};
return(
<div className="space-y-6">
<div className="flex justify-between items-center">
<h2 className="text-3xl font-bold">Gestione {labels[section]}</h2>
<div className="flex gap-2">
<input type="text" placeholder="Cerca..." value={search} onChange={(e)=>setSearch(e.target.value)} className="px-4 py-2 border-2 rounded-lg w-64"/>
{section==='attrezzature'&&<button onClick={()=>handlePrintQRMultiple(filtered)} className="flex items-center gap-2 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">🖨️ Stampa Etichette QR</button>}
<button onClick={()=>openModal(section)} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"><Icon.Plus/>Nuovo</button>
</div>
</div>
<div className="grid gap-4">
{filtered.map(item=>(
<div key={item.id} className="bg-white rounded-xl shadow-lg p-6 hover:shadow-2xl transition-all">
<div className="flex justify-between items-start">
<div className="flex-1">
{section==='fornitori'&&<div><h3 className="text-xl font-bold">{item.nome}</h3><p className="text-sm text-gray-600">P.IVA: {item.piva} - Tel: {item.tel}</p></div>}
{section==='cantieri'&&<div><h3 className="text-xl font-bold">{item.nome}</h3><p className="text-gray-600">{item.cliente}</p><div className="mt-2"><span className={`px-3 py-1 rounded-full text-xs ${item.stato==='In corso'?'bg-green-100 text-green-800':'bg-blue-100 text-blue-800'}`}>{item.stato}</span><span className="ml-2 text-sm">{fmt.curr(item.speso)} / {fmt.curr(item.budget)}</span></div></div>}
{section==='dipendenti'&&<div><h3 className="text-xl font-bold">{item.nome} {item.cognome}</h3><p className="text-gray-600">{item.ruolo} - {item.matricola}</p><div className="mt-2 flex gap-2"><button onClick={()=>openModal('dipDettaglio',item)} className="px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs">✓ {item.dpi?.length||0} DPI</button><button onClick={()=>openModal('dipDettaglio',item)} className="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs">✓ {item.visite?.length||0} Visite</button><button onClick={()=>openModal('dipDettaglio',item)} className="px-3 py-1 bg-purple-100 text-purple-800 rounded-full text-xs">✓ {item.corsi?.length||0} Corsi</button></div></div>}
{section==='attrezzature'&&<div><h3 className="text-lg font-bold">{item.nome}</h3><p className="text-sm font-mono text-gray-600">{item.codice}</p><div className="mt-2 space-y-2"><p className="text-sm"><strong>📦 Totale:</strong> {item.qta||1} {item.um||'pz'}</p><div className="bg-gray-50 p-2 rounded"><p className="text-xs font-bold mb-1">Giacenze per ubicazione:</p>{Object.entries(item.giacenze||{}).map(([loc,qty])=><div key={loc} className="flex justify-between text-xs"><span>📍 {loc}</span><span className={`font-bold ${(qty/(item.qta||1))>0.5?'text-green-600':(qty/(item.qta||1))>0.2?'text-orange-600':'text-red-600'}`}>{qty} {item.um||'pz'} ({Math.round((qty/(item.qta||1))*100)}%)</span></div>)}{Object.keys(item.giacenze||{}).length===0&&<p className="text-xs text-gray-500">Nessuna giacenza</p>}</div><div><span className={`px-3 py-1 rounded-full text-xs ${item.stato==='Disponibile'?'bg-green-100 text-green-800':'bg-orange-100 text-orange-800'}`}>{item.stato}</span>{item.tipo==='composta'&&<span className="ml-2 px-3 py-1 rounded-full text-xs bg-purple-100 text-purple-800">🔧 Composta ({item.componenti?.length||0} pz)</span>}</div></div><button onClick={()=>handlePrintQR(item.codice,item.nome)} className="mt-2 px-3 py-2 bg-blue-600 text-white rounded-lg text-sm">QR Code</button></div>}
{section==='materiali'&&<div><h3 className="text-lg font-bold">{item.nome}</h3><p className="text-sm text-gray-600">Giacenza: {item.giacenza} {item.um} - Costo: {fmt.curr(item.costo)}/{item.um}</p>{item.giacenza<=item.min&&<span className="inline-block mt-2 px-2 py-1 bg-red-100 text-red-800 rounded text-xs">⚠️ Scorta minima</span>}</div>}
{section==='movimenti'&&<div><h3 className="text-lg font-bold">{fmt.datetime(item.data)}</h3><p className="text-sm text-gray-600">Attrezzatura: {attrezzature.find(a=>a.id===item.attrId)?.nome}</p><p className="text-sm"><strong>Qta:</strong> {item.qta||1} {attrezzature.find(a=>a.id===item.attrId)?.um||'pz'}</p><p className="text-sm">📍 Da: <strong>{item.da}</strong> → A: <strong>{item.a}</strong></p></div>}
{section==='mezzi'&&<div><h3 className="text-xl font-bold">{item.tipo} {item.marca} {item.modello}</h3><p className="text-sm text-gray-600">Targa: {item.targa} - Km: {item.km?.toLocaleString()}</p></div>}
{section==='rapportini'&&<div><h3 className="text-xl font-bold">Rapportino {fmt.date(item.data)}</h3><p className="text-gray-600">{cantieri.find(c=>c.id===item.cantiereId)?.nome}</p><button onClick={()=>handlePrintPDF('Rapportino',item)} className="mt-2 px-4 py-2 bg-green-600 text-white rounded-lg text-sm"><Icon.Printer/> PDF</button></div>}
{section==='ddt'&&<div><h3 className="text-xl font-bold">DDT {item.numero}</h3><p className="text-sm text-gray-600">Fornitore: {fornitori.find(f=>f.id===item.fornitoreId)?.nome}</p><p className="font-bold text-green-600">{fmt.curr(item.totale)}</p><button onClick={()=>handlePrintPDF('DDT',item)} className="mt-2 px-4 py-2 bg-green-600 text-white rounded-lg text-sm"><Icon.Printer/> PDF</button></div>}
{section==='ordini'&&<div><h3 className="text-xl font-bold">Ordine {item.numero}</h3><p className="text-sm text-gray-600">Fornitore: {fornitori.find(f=>f.id===item.fornitoreId)?.nome}</p><span className={`px-3 py-1 rounded-full text-xs ${item.stato==='Evaso'?'bg-green-100 text-green-800':'bg-orange-100 text-orange-800'}`}>{item.stato}</span></div>}
{section==='scadenze'&&<div><div className="flex justify-between"><div><h3 className="text-lg font-bold">{item.tipo}</h3><p className="text-sm text-gray-600">{item.descrizione}</p></div><span className={`px-3 py-1 rounded-full text-xs ${item.completato?'bg-gray-100 text-gray-600':new Date(item.data)<new Date()?'bg-red-100 text-red-800':'bg-green-100 text-green-800'}`}>{item.completato?'✓':fmt.date(item.data)}</span></div></div>}
</div>
<div className="flex gap-2">
<button onClick={()=>openModal(section,item)} className="p-2 bg-blue-100 text-blue-600 rounded-lg hover:bg-blue-200"><Icon.Edit/></button>
</div>
</div>
</div>
))}
</div>
</div>
);
};

return(
<div className="min-h-screen bg-gray-50">
<Modal/>
<div className="bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 text-white shadow-2xl">
<div className="container mx-auto px-6 py-5">
<div className="flex justify-between items-center">
<div>
<h1 className="text-4xl font-bold">Iazzetta Gestionale</h1>
<p className="text-sm mt-1 opacity-90">{user.email}</p>
</div>
<div className="flex gap-2">
<button onClick={handleExportExcel} className="px-4 py-2 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg flex items-center gap-2"><Icon.Download/>Excel</button>
<button onClick={handleBackup} className="px-4 py-2 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg">Backup</button>
<button onClick={handleLogout} className="px-4 py-2 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg">Esci</button>
</div>
</div>
</div>
</div>
<div className="container mx-auto px-6 py-6">
<div className="flex gap-6">
<div className="w-64 flex-shrink-0">
<div className="bg-white rounded-2xl shadow-xl p-4 sticky top-6">
<nav className="space-y-2">
{menu.map(m=><button key={m.id} onClick={()=>setSection(m.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium ${section===m.id?'bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg':'text-gray-700 hover:bg-gray-100'}`}><m.icon/><span>{m.label}</span></button>)}
</nav>
</div>
</div>
<div className="flex-1">{renderSection()}</div>
</div>
</div>
</div>
);
};

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
<script>
if('serviceWorker'in navigator){
window.addEventListener('load',()=>{
navigator.serviceWorker.register('data:text/javascript;base64,'+btoa(`
self.addEventListener('install',e=>{
  console.log('SW: Installato');
  self.skipWaiting();
});
self.addEventListener('activate',e=>{
  console.log('SW: Attivato');
  e.waitUntil(clients.claim());
});
self.addEventListener('fetch',e=>{
  e.respondWith(
    fetch(e.request).catch(()=>caches.match(e.request))
  );
});
`)).then(()=>console.log('✅ PWA attiva!')).catch(e=>console.log('PWA:',e));
});
}
</script>
</body>
</html>
